name: build
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pyinstaller zstandard
      - run: pyinstaller --noconfirm --windowed --onefile apkg2forms.py
      - uses: actions/upload-artifact@v4
        with:
          name: apkg2forms-${{ matrix.os }}
          path: dist/*
