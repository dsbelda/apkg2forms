name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, asset: apkg2forms-windows.exe, pack: 'mv dist/apkg2forms.exe apkg2forms-windows.exe'}
          - {os: macos-latest, asset: apkg2forms-macos.zip, pack: 'ditto -c -k --keepParent dist/apkg2forms.app apkg2forms-macos.zip'}
          - {os: ubuntu-latest, asset: apkg2forms-linux, pack: 'mv dist/apkg2forms apkg2forms-linux'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pyinstaller zstandard pypdf pillow
      - run: pyinstaller --noconfirm --windowed --onefile apkg2forms.py
      - run: ${{ matrix.pack }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.asset }}', path: '${{ matrix.asset }}'}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: '${{ matrix.asset }}'}
